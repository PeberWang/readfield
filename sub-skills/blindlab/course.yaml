# 课程实例配置 —— 复用者开新课改这个文件即可，不动代码。
# 本文件是心眼子活动课（《城堡》读书会）的实例；删掉它则回退到代码内置默认值。

# 轮次：盲评对照的语境组。同一批 skill 走全部轮次，共享同一套盲码（首轮分配，后续轮次继承）。
# 本次课（2026-07-19）只设单轮：三道题（城堡 1 + 现实 2）合并盲评，不做跨语境定量对照。
rounds:
  day1:
    dir: main           # data/scenarios/ 下的场景目录名
    label: 情境盲评      # 展示名（deck、评分表标题用）

# 盲评维度（每维度按 score.min–score.max 打分）
dims: [自然, 技巧, 远见]

score:
  min: 1
  max: 5
  # 单选选项的方向标注：字段类型是单选，选项为「分数（方向）」，如 5（非常好）
  labels: {1: 很差, 2: 较差, 3: 一般, 4: 较好, 5: 非常好}

# 基线（裸模型对照）：一份空壳成品 skill——只有情景/任务说明和输出要求、没有人格策略，
# 由主讲人课前用启动包制作并放进 data/skills/。enabled: false 时它作为普通 skill
# 参与盲评占盲码；false 时即使文件夹存在也不上场。打不过基线的 skill 是负优化。
baseline:
  enabled: false
  key: baseline

# 简单心法走裸 API 时的提示词模板。
# user 模板可用变量：{skill} 心法正文、{scenario} 场景全文、{placeholder} 回应占位符。
prompts:
  system: |-
    你在参与一场组织理解力实验。你将代入一个场景中的主人公，在留白处给出这个人物的回应（话语、动作或简短心理活动，视语境而定）。

    有一份「心法」规定了你是谁、你如何理解组织中的权力与人情、你的策略与分寸。你必须完全依照这份心法来回应，而不是依照你自己的偏好。

    要求：
    - 只输出主人公在留白处的回应本身，不要解释、不要评论、不要复述场景
    - 语气与长度与场景语境相称，像一个真人在那个处境里会说的话
    - 用中文回应
  user: |-
    【心法】
    {skill}

    【场景】
    {scenario}

    请写出主人公在 {placeholder} 处的回应。
